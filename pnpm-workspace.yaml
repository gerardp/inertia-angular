packages:
  - packages/*
  - packages/*/test-app
  - playgrounds/*
  - tests/app

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@tailwindcss/oxide'
  - esbuild
  - lmdb
  - msgpackr-extract

overrides:
  cookie: '>=0.7.0'

auditConfig:
  ignoreGhsas:
    # braces has no patched release; it only reaches the other adapters' es-check dev tooling
    - GHSA-vfj7-8cjw-p6xm
